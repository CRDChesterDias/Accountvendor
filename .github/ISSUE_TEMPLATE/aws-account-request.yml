name: AWS Account Vending Request
description: Request a new AWS account
title: "[AWS Account Request]: <account-name>"
labels: ["account-request", "pending-review"]

body:
  - type: markdown
    attributes:
      value: |
        # AWS Account Vending Request

        Submit this request to create a new AWS account.

        After submission, the Cloud Platform team will review and approve the request.

  - type: input
    id: account_name
    attributes:
      label: Account Name
      description: Name of the AWS account.
      placeholder: app-dev-001
    validations:
      required: true

  - type: input
    id: account_email
    attributes:
      label: Account Email
      description: Unique email address for the AWS account.
      placeholder: app-dev-001@example.com
    validations:
      required: true

  - type: input
    id: target_ou_id
    attributes:
      label: Target OU ID
      description: AWS Organizations OU ID where this account should be moved.
      placeholder: ou-xxxx-yyyyyyyy
    validations:
      required: true

  - type: textarea
    id: business_justification
    attributes:
      label: Business Justification
      description: Why is this AWS account required?
      placeholder: This account is needed for the new application development environment.
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Requester Acknowledgement
      options:
        - label: I confirm the account name, email, and OU are correct.
          required: true
        - label: I understand this request requires approval before provisioning.
          required: true
