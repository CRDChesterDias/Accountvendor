name: AWS Account Request
description: Request a new AWS account
title: "AWS Account Request - <app>-<env>"
labels: ["account-request", "pending-review"]

body:
  - type: markdown
    attributes:
      value: |
        ## AWS Account Request Form
        Please fill all required fields.

  - type: input
    id: account_name
    attributes:
      label: Account Name
      description: Must follow naming standard (app-env-###)
      placeholder: app-dev-001
    validations:
      required: true

  - type: input
    id: account_email
    attributes:
      label: Account Email
      placeholder: app-dev-001@example.com
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - dev
        - test
        - stage
        - prod
    validations:
      required: true

  - type: input
    id: ou
    attributes:
      label: Target OU ID
      placeholder: ou-xxxx-yyyyyyyy
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner Email
      placeholder: owner@example.com
    validations:
      required: true

  - type: input
    id: cost_center
    attributes:
      label: Cost Center
      placeholder: CC1234
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Business Justification
      description: Why is this account needed?
    validations:
      required: true
