name: AWS Account Vending Request
description: Request one or more AWS accounts through the account vending process
title: "[AWS Account Request]: <app-name>"
labels: ["account-request", "pending-review"]
assignees:
  - cloud-platform-team

body:
  - type: markdown
    attributes:
      value: |
        # AWS Account Vending Request

        Use this form to request new AWS commercial accounts.

        **Approval is required before provisioning begins.**

        ---

  - type: dropdown
    id: request_type
    attributes:
      label: Request Type
      description: Select whether this is for one account or multiple accounts.
      options:
        - Single Account
        - Multiple Accounts
    validations:
      required: true

  - type: dropdown
    id: business_unit
    attributes:
      label: Business Unit
      description: Select the business unit requesting the account.
      options:
        - Cloud Platform
        - Application Team
        - Security
        - Data
        - Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: accounts
    attributes:
      label: Account Details
      description: |
        Enter one account per line using CSV format.

        Format:
        account_name,account_email,environment,target_ou_id,owner,cost_center

        Example:
        app-dev-001,app-dev-001@example.com,dev,ou-xxxx-yyyyyyyy,owner@example.com,CC1234
      value: |
        account_name,account_email,environment,target_ou_id,owner,cost_center
        app-dev-001,app-dev-001@example.com,dev,ou-xxxx-yyyyyyyy,owner@example.com,CC1234
    validations:
      required: true

  - type: dropdown
    id: criticality
    attributes:
      label: Business Criticality
      description: Select the criticality of workloads expected in these accounts.
      options:
        - Low
        - Medium
        - High
        - Mission Critical
    validations:
      required: true

  - type: checkboxes
    id: baseline_controls
    attributes:
      label: Required Baseline Controls
      description: Confirm required controls for account provisioning.
      options:
        - label: CloudTrail must be enabled
          required: true
        - label: AWS Config must be enabled
          required: true
        - label: GuardDuty must be enabled
          required: true
        - label: Budget alert must be configured
          required: true
        - label: IAM Identity Center access must be assigned
          required: true

  - type: textarea
    id: access_requirements
    attributes:
      label: Access Requirements
      description: Mention required permission sets, admin groups, read-only groups, or application team access.
      placeholder: |
        Admin Group: AWS-App-Dev-Admins
        ReadOnly Group: AWS-App-Dev-ReadOnly
        Terraform Role Required: Yes
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Business Justification
      description: Explain why these account(s) are required.
      placeholder: |
        Example:
        These accounts are required for a new application landing zone supporting dev and test environments.
    validations:
      required: true

  - type: checkboxes
    id: requester_acknowledgement
    attributes:
      label: Requester Acknowledgement
      options:
        - label: I confirm the account details are accurate.
          required: true
        - label: I understand this request requires Cloud Platform approval.
          required: true
        - label: I understand account usage may be monitored for security and cost governance.
          required: true
