name: AWS Account Vending from Issue

on:
  issues:
    types:
      - opened

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  provision-account:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ORG_MANAGEMENT_ROLE_ARN }}
          aws-region: us-east-1

      - name: Parse issue input
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            function extract(label) {
              const regex = new RegExp(`### ${label}\\s+([\\s\\S]*?)(?=###|$)`);
              const match = body.match(regex);
              return match ? match[1].trim() : "";
            }

            core.setOutput("account_name", extract("Account Name"));
            core.setOutput("account_email", extract("Account Email"));
            core.setOutput("target_ou_id", extract("Target OU ID"));

      - name: Create AWS account
        run: |
          set -euo pipefail

          ACCOUNT_NAME="${{ steps.parse.outputs.account_name }}"
          ACCOUNT_EMAIL="${{ steps.parse.outputs.account_email }}"
          TARGET_OU_ID="${{ steps.parse.outputs.target_ou_id }}"

          echo "ACCOUNT_NAME=$ACCOUNT_NAME" >> $GITHUB_ENV
          echo "ACCOUNT_EMAIL=$ACCOUNT_EMAIL" >> $GITHUB_ENV
          echo "TARGET_OU_ID=$TARGET_OU_ID" >> $GITHUB_ENV

          if [[ -z "$ACCOUNT_NAME" || -z "$ACCOUNT_EMAIL" || -z "$TARGET_OU_ID" ]]; then
            echo "Missing required input from issue."
            exit 1
          fi

          REQUEST_ID=$(aws organizations create-account \
            --email "$ACCOUNT_EMAIL" \
            --account-name "$ACCOUNT_NAME" \
            --role-name OrganizationAccountAccessRole \
            --query 'CreateAccountStatus.Id' \
            --output text)

          echo "REQUEST_ID=$REQUEST_ID" >> $GITHUB_ENV

      - name: Wait for account creation
        run: |
          set -euo pipefail

          while true; do
            STATUS=$(aws organizations describe-create-account-status \
              --create-account-request-id "$REQUEST_ID" \
              --query 'CreateAccountStatus.State' \
              --output text)

            echo "Status: $STATUS"

            if [[ "$STATUS" == "SUCCEEDED" ]]; then
              ACCOUNT_ID=$(aws organizations describe-create-account-status \
                --create-account-request-id "$REQUEST_ID" \
                --query 'CreateAccountStatus.AccountId' \
                --output text)

              echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
              break
            fi

            if [[ "$STATUS" == "FAILED" ]]; then
              REASON=$(aws organizations describe-create-account-status \
                --create-account-request-id "$REQUEST_ID" \
                --query 'CreateAccountStatus.FailureReason' \
                --output text)

              echo "Account creation failed: $REASON"
              exit 1
            fi

            sleep 30
          done

      - name: Move account to OU
        run: |
          set -euo pipefail

          ROOT_ID=$(aws organizations list-roots \
            --query 'Roots[0].Id' \
            --output text)

          aws organizations move-account \
            --account-id "$ACCOUNT_ID" \
            --source-parent-id "$ROOT_ID" \
            --destination-parent-id "$TARGET_OU_ID"

      - name: Comment account details and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = `✅ AWS account provisioned successfully.

            **Account Name:** ${process.env.ACCOUNT_NAME}
            **Account Email:** ${process.env.ACCOUNT_EMAIL}
            **Account ID:** ${process.env.ACCOUNT_ID}
            **Target OU:** ${process.env.TARGET_OU_ID}
            **Access Role:** arn:aws:iam::${process.env.ACCOUNT_ID}:role/OrganizationAccountAccessRole

            Issue closed automatically.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
